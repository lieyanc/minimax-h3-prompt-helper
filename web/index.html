<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#04070a" />
    <title>MiniMax H3 提示词助手</title>
    <style>
      /* Painted before the stylesheet arrives, so a slow LAN load does not
         flash white. Kept in sync with --background in index.css. */
      html { background-color: #04070a; }
      html.light { background-color: #f9fafb; }
    </style>
    <script>
      // Resolve the stored theme before first paint; the ThemeProvider takes
      // over once React mounts. Dark is the default.
      (function () {
        var theme = "dark";
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "light" || stored === "dark") {
            theme = stored;
          } else if (stored === "system") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
        } catch (e) {
          /* private mode: stay on the default */
        }
        var root = document.documentElement;
        root.classList.remove("light", "dark");
        root.classList.add(theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
